name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install linters
        run: npm install

      - name: Lint HTML
        run: npm run lint:html

      - name: Lint CSS
        if: success() || failure()
        run: npm run lint:css

      - name: Lint JavaScript
        if: success() || failure()
        run: npm run lint:js